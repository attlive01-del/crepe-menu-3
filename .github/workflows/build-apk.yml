name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Test Application
        run: npm test

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_MENU_URL: ${{ vars.VITE_PUBLIC_MENU_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Configure VITE_SUPABASE_URL in Actions secrets"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Configure VITE_SUPABASE_ANON_KEY in Actions secrets"; exit 1; }
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android Platform..."
            npx cap add android
          fi
          echo "Syncing Capacitor..."
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrepeCart-Menu-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
